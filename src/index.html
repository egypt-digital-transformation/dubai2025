<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AMEA 2026</title>
  
  <base href="/"/>
  
  <!-- PERFORMANCE: Preconnect to critical origins (saves ~1.1s) -->
  <link rel="preconnect" href="https://www.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://apis.google.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  
  <!-- PERFORMANCE: Defer non-critical scripts -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <meta name="color-scheme" content="light"/>
  
  
  <!-- ACCESSIBILITY FIX: Remove user-scalable=no (accessibility issue) -->
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"/>
  
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>
  
  <!-- SEO: Add meta description (currently missing) -->
  <meta name="description" content="AMEA 2026 Conference - Connect, network, and explore event schedules, venues, and sessions."/>
  
  <!-- PWA Theme Color: Holcim Premium Blue (#041739) per 2025 Brand Guidelines -->
  <meta name="theme-color" content="#041739"/>

  <!-- Google Fonts: Official Fallbacks (Montserrat for headlines, Reddit Sans for copy) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;0,900;1,400;1,700&family=Reddit+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  
  <!-- iOS / Mobile PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="AMEA 2026"/>
  
  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="48x48" href="assets/app-icon-48.png"/>
  <link rel="apple-touch-icon" sizes="152x152" href="assets/app-icon-152.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/app-icon-180.png"/>
  <link rel="apple-touch-icon" sizes="192x192" href="assets/app-icon-192.png"/>
  
  <!-- Manifest -->
  <link rel="manifest" href="manifest.webmanifest">
  
  <!-- PRELOAD: Holcim Brand Fonts -->
  <link rel="preload" href="/assets/fonts/Holcim-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/assets/fonts/Holcim-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/assets/fonts/Holcim-HeadlineBlack.ttf" as="font" type="font/ttf" crossorigin>
  
  <!-- PERFORMANCE: Inline critical CSS to prevent layout shift -->
  <style>
    /* Prevent layout shift during initial load */
    app-root {
      display: block;
      min-height: 100vh;
    }
    
    /* Reserve space for quick-actions to prevent CLS */
    .quick-actions {
      min-height: 200px;
    }
    
    /* Holcim Brand Fonts */
    @font-face {
      font-family: 'Holcim';
      src: local('Holcim Regular'), local('Holcim-Regular'), url('/assets/fonts/Holcim-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Holcim';
      src: local('Holcim Bold'), local('Holcim-Bold'), url('/assets/fonts/Holcim-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Holcim';
      src: local('Holcim Headline Black'), local('Holcim-HeadlineBlack'), url('/assets/fonts/Holcim-HeadlineBlack.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Holcim Headline';
      src: local('Holcim Headline Black'), local('Holcim-HeadlineBlack'), url('/assets/fonts/Holcim-HeadlineBlack.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    
    /* Loading state to prevent flash */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Holcim', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --ion-font-family: 'Holcim', sans-serif;
    }
  </style>
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
  <script type="module" src="/main.ts"></script>
</body>
</html>
