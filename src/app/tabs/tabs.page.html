<ion-header class="app-header">
  <ion-toolbar>
    <div class="app-brand">
      <img src="assets/logo.png" alt="" />
      <span>
        <strong>AHLAN</strong>
        <small>AMEA 2026</small>
      </span>
    </div>
    <ion-buttons slot="end">
      <ion-button fill="clear" aria-label="Notifications" (click)="openNotifications()">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" aria-label="Sign out" (click)="signOut()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" href="/tabs/home">
      <ion-icon aria-hidden="true" name="home"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="agenda" href="/tabs/agenda">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Agenda</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="projects" href="/tabs/projects">
      <ion-icon name="business-outline"></ion-icon>
      <ion-label>Projects</ion-label>
    </ion-tab-button>

    <!--
    <ion-tab-button tab="network" href="/tabs/network">
      <ion-icon aria-hidden="true" name="people-outline"></ion-icon>
      <ion-label>Network</ion-label>
    </ion-tab-button>
    -->

    <ion-tab-button tab="resources" href="/tabs/resources">
      <ion-icon aria-hidden="true" name="book-outline"></ion-icon>
      <ion-label>Resources</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="more" href="/tabs/more">
      <ion-icon aria-hidden="true" name="menu-outline"></ion-icon>
      <ion-label>More</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
