<ion-content [scrollY]="true">
  <main class="notifications-page">
    <section class="notifications-content" aria-labelledby="notifications-title">
      <p class="notifications-eyebrow">STAY IN THE KNOW</p>
      <h1 id="notifications-title">Event updates</h1>
      <p class="notifications-intro">The latest from your event team.</p>

    

      <p *ngIf="isLoading" class="list-message" role="status">Loading your notifications…</p>
      <div *ngIf="loadError" class="list-error" role="alert">
        <p>{{ loadError }}</p>
        <button type="button" (click)="loadNotifications()">Try again</button>
      </div>
      <p *ngIf="!isLoading && !loadError && !notifications.length" class="empty-state">
        You haven’t received any event updates yet.
      </p>

      <div class="notification-list" *ngIf="!isLoading && !loadError && notifications.length">
        <article
          class="notification-card"
          *ngFor="let notification of notifications"
          [class.unread]="!notification.opened"
        >
          <div class="notification-icon">
            <ion-icon name="notifications-outline" aria-hidden="true"></ion-icon>
          </div>
          <div class="notification-copy">
            <div class="notification-meta">
              <span>EVENT UPDATE</span>
              <span *ngIf="!notification.opened" class="unread-label">NEW</span>
              <time *ngIf="notification.createdAt" [attr.datetime]="notification.createdAt">
                {{ notification.createdAt | date: 'dd/MM/yyyy' }}
              </time>
            </div>
            <h2>{{ notification.title }}</h2>
            <p>{{ notification.body }}</p>
            <button type="button" class="notification-open" (click)="openNotification(notification)">
              View update
              <ion-icon name="open-outline" aria-hidden="true"></ion-icon>
            </button>
          </div>
        </article>
      </div>
      <button
        *ngIf="!isLoading && !loadError && notifications.length"
        type="button"
        class="refresh-button"
        (click)="loadNotifications()"
      >
        Refresh updates
      </button>
    </section>
  </main>
</ion-content>
