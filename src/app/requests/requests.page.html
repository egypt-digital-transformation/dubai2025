<ion-content class="module-page"><main class="module-shell"><header class="module-hero"><p class="eyebrow">YOUR CONCIERGE</p><h1>A helping hand</h1><p>Create a request and follow its progress.</p></header><section class="module-card"><h2>New request</h2><label>What do you need?<select [(ngModel)]="requestType"><option>Transport</option><option>Hotel</option><option>Technical support</option><option>Event information</option><option>Other</option></select></label><label>Details<textarea [(ngModel)]="details" placeholder="Describe what you need…"></textarea></label><button class="module-button" type="button" (click)="create()">Create demo request</button><p class="module-muted">For urgent help, contact on-site staff directly. This demo does not dispatch requests.</p></section><section class="module-card"><div class="module-section-heading"><h2>All requests</h2><select [(ngModel)]="status" aria-label="Filter status"><option value="all">All</option><option>Open</option><option>In progress</option><option>Resolved</option></select></div><p *ngIf="!filteredRequests.length" class="module-muted">No requests in this view.</p><div class="module-row" *ngFor="let request of filteredRequests"><div><strong>{{ request.type }}</strong><small>{{ request.details }}</small></div><span class="module-muted">{{ request.status }}</span></div></section></main></ion-content>
