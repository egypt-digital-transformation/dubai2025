<ion-content class="splash-content" [fullscreen]="true">
  <main class="splash-wrapper">
    <!-- Holcim brand mark -->
    <div class="splash-brand">
      <img src="assets/logo-mark.png" alt="" class="brand-icon" aria-hidden="true" />
      <span class="brand-name">HOLCIM</span>
    </div>

    <!-- Event title -->
    <section class="splash-title-block">
      <h1 class="splash-title">
        <span class="line">Welcome to</span>
        <span class="line"><span class="accent">AMEA</span> Management</span>
        <span class="line">Meeting</span>
      </h1>
      <p class="splash-location">Cairo 2026</p>
    </section>

    <!-- Cairo skyline artwork -->
    <div class="splash-banner">
      <img src="assets/splashbanner.png" alt="Cairo landmarks" class="banner-img" />
    </div>
  </main>
</ion-content>
