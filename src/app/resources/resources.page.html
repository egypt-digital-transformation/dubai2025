<ion-content class="resources-content">
  <main class="resource-library">
    <header class="resource-library-header">
      <p class="resource-kicker">IDEAS TO TAKE WITH YOU</p>
      <h1>Resource library</h1>
      <p>Presentations, recordings and shared knowledge.</p>
      <img src="assets/skyline.webp" alt="" class="resource-header-overlay" />
    </header>

    <section class="resource-tools" aria-label="Resource filters">
      <div class="resource-filters" role="group" aria-label="Filter by resource type">
        <button
          *ngFor="let filter of resourceFilters"
          type="button"
          [class.active]="activeFilter === filter"
          (click)="setFilter(filter)">
          {{ filter }}
        </button>
      </div>

      <label class="resource-search">
        <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
        <input
          type="search"
          [(ngModel)]="resourceSearch"
          placeholder="Search resources"
          aria-label="Search resources" />
        <button
          *ngIf="resourceSearch"
          type="button"
          class="clear-search"
          (click)="resourceSearch = ''"
          aria-label="Clear resource search">
          <ion-icon name="close-circle-outline"></ion-icon>
        </button>
      </label>
    </section>

    <section class="resource-empty" aria-live="polite">
      <ion-icon name="folder-open-outline" aria-hidden="true"></ion-icon>
      <h2>Good ideas are worth keeping.</h2>
      <p>
        The event team will publish approved presentations, recordings and photos here.
        No files have been uploaded yet.
      </p>
    </section>
  </main>
</ion-content>
